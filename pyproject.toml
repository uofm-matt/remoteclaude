# Minimal pyproject — not a packaged project (no [project] table). Carries the ruff lint
# floor and the bandit config that CI enforces.
[tool.coverage.run]
# The project's measured set — the seven shipped modules, so a bare `coverage run`
# measures the same thing CI's explicit --source does (and tooling that reads
# coverage config sees a configured set, not "whatever the suite imported").
source = ["rc_launcher", "rc_claude", "rc_state", "rc_templates", "rc_status",
          "rc_state_hook", "rc_healthcheck"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E9"]  # real errors only (pyflakes + syntax) — the gate's floor, not style

[tool.bandit]
exclude_dirs = ["tests", "review"]
# Two deliberate, documented choices; everything else Medium+ must stay clean:
#   B104 — the launcher binds 0.0.0.0 on purpose (reached over the Tailscale subnet route / LAN)
#   B310 — the only urlopen is the user-configured RC_NOTIFY_URL ntfy/webhook push
skips = ["B104", "B310"]
