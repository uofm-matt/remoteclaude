name: Android APK + tests

# Builds the debug APK for the android/ WebView wrapper so you never need the
# Android toolchain on the Mac. Runs on a pull request or push that touches the app,
# or on demand from the Actions tab (Run workflow). Download the APK from the run's
# Artifacts. The pull_request trigger gates the Kotlin tests + build before merge, not
# just after it on push to main.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/app/**'
      - 'android/*.gradle.kts'
      - 'android/gradle.properties'
      - 'android/gradle/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/app/**'
      - 'android/*.gradle.kts'
      - 'android/gradle.properties'
      - 'android/gradle/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests (upload resume logic)
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        env:
          # No auth token: the repo is public and artifacts are world-downloadable, so CI
          # builds are untokened by design — the app asks once and keeps it in prefs.
          # RC_HOST comes from a repo *variable* (not tracked) so the source keeps a
          # generic default while your builds bake the real host.
          RC_HOST: ${{ vars.RC_HOST }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rc.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/rc.keystore"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Guard — no auth token can reach the APK
        working-directory: android
        run: |
          # Value-independent: fails on the mechanism (a token field or secret wiring
          # reappearing), so it keeps working after any rotation.
          if grep -n 'RC_TOKEN' app/build.gradle.kts; then
            echo '::error::RC_TOKEN buildConfigField is back in build.gradle.kts'; exit 1; fi
          if grep -rn 'secrets[.]RC_TOKEN' ../.github/workflows/; then
            echo '::error::a workflow references an RC_TOKEN secret again'; exit 1; fi
          if unzip -p app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' | strings | grep -qx 'RC_TOKEN'; then
            echo '::error::RC_TOKEN symbol present in the shipped dex'; exit 1; fi
          echo "guard OK: no token field, no secret wiring, dex clean"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-control-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
